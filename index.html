<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#003b71">
<title>Viabilidade – Câmera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #fff; }
  header { background: #fff; color: #003b71; padding: 8px 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  header small { color: #555; font-weight: normal; }
  #usuario { padding: 6px 12px; font-size: 14px; color: #bbb; display: flex; justify-content: space-between; align-items: center; }
  #usuario button { font-size: 14px; padding: 4px 10px; }
  .linha { display: flex; gap: 8px; padding: 8px 12px; align-items: center; }
  input, select, button { font-size: 18px; padding: 10px; border-radius: 8px; border: 1px solid #444; }
  input, select { flex: 1; min-width: 0; background: #222; color: #fff; }
  button { background: #333; color: #fff; }
  button.prim { background: #0a6ebd; border-color: #0a6ebd; }
  #video { width: 100%; max-height: 58vh; background: #000; display: block; }
  #gps, #status { padding: 6px 12px; font-size: 15px; }
  .ok { color: #6fdc8c; } .alerta { color: #ffcc4d; } .erro { color: #ff7b7b; }
  #disparo { width: 84px; height: 84px; border-radius: 50%; border: 6px solid #fff; background: #d33; font-size: 0; }
  #disparo:disabled { background: #555; }
  #barra { display: flex; justify-content: space-around; align-items: center; padding: 10px; }
  #fila { list-style: none; margin: 0; padding: 0 12px 20px; font-size: 14px; }
  #fila li { padding: 4px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; gap: 8px; }
  .oculto { display: none !important; }
  #flashTela { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; }
</style>
</head>
<body>
<header><span>ALPITEL ENERGY</span><small>Viabilidade – câmera</small></header>
<div id="usuario" class="oculto"><span id="nomeUsuario"></span><button id="sairLogin">Sair</button></div>

<div id="telaSenha" class="oculto">
  <div class="linha"><input id="senha" placeholder="Sua senha de viabilizador" autocapitalize="characters" autocomplete="off"></div>
  <div class="linha"><button class="prim" id="salvarSenha">Entrar</button></div>
  <div id="msgSenha" class="linha erro"></div>
</div>

<div id="config" class="oculto">
  <div class="linha"><input id="obra" placeholder="Nº do projeto (ex.: DACASUL2501427)" autocapitalize="characters"></div>
  <div class="linha"><select id="wl"></select><button class="prim" id="iniciar">Iniciar</button></div>
</div>

<div id="camera" class="oculto">
  <div class="linha" style="justify-content:space-between">
    <b id="titulo"></b><button id="sair">Voltar</button>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <div id="gps" class="alerta">GPS: procurando sinal…</div>
  <div id="barra">
    <button id="flash" style="visibility:hidden">Flash</button>
    <button id="disparo" disabled aria-label="Fotografar">foto</button>
    <button id="proxima">Próxima WL ›</button>
  </div>
</div>

<div id="status" class="alerta"></div>
<ul id="fila"></ul>
<canvas id="tela" class="oculto"></canvas>
<div id="flashTela"></div>

<script>
// Endereço do servidor (Apps Script). Não é segredo; a senha fica só no celular.
var SERVIDOR = 'https://script.google.com/macros/s/AKfycbz8hmbLMHaEJj7Secv24elyApKVqVyBFqDzCiaI7iE1ckiFRSueBUvV5X5NlD265V-Y/exec';
var MAX_WL = 40, LADO_MAX = 4000, PRECISAO_ALERTA = 30, QUALIDADE = 0.9;

var stream = null, captura = null, pos = null, vigia = null, flashLigado = false;
var enviando = false, db = null, enviadas = [];
var $ = function (id) { return document.getElementById(id); };
function mostrar(id, sim) { $(id).classList.toggle('oculto', !sim); }

for (var i = 1; i <= MAX_WL; i++) {
  var o = document.createElement('option');
  o.value = o.textContent = 'WL' + ('0' + i).slice(-2);
  $('wl').appendChild(o);
}

function guardado(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function dois(n) { return ('0' + n).slice(-2); }
function dataHora(d) {
  return dois(d.getDate()) + '/' + dois(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' +
         dois(d.getHours()) + ':' + dois(d.getMinutes()) + ':' + dois(d.getSeconds());
}
function obraAtual() { return $('obra').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); }

// ---------- Fila guardada no celular (IndexedDB) ----------
function abrirBanco() {
  return new Promise(function (ok, falha) {
    var req = indexedDB.open('viabilidade', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('fila', { keyPath: 'idFoto' }); };
    req.onsuccess = function () { ok(req.result); };
    req.onerror = function () { falha(req.error); };
  });
}
function tx(modo, fn) {
  return new Promise(function (ok, falha) {
    var t = db.transaction('fila', modo), s = t.objectStore('fila'), r = fn(s);
    t.oncomplete = function () { ok(r && r.result); };
    t.onerror = function () { falha(t.error); };
  });
}
function filaTodos() { return tx('readonly', function (s) { return s.getAll(); }); }
function filaPor(item) { return tx('readwrite', function (s) { s.put(item); }); }
function filaTirar(id) { return tx('readwrite', function (s) { s.delete(id); }); }

// ---------- Login do viabilizador ----------
$('salvarSenha').onclick = function () {
  var s = $('senha').value.trim().toUpperCase();
  if (!s) return;
  $('msgSenha').textContent = 'Conferindo…';
  chamar({ acao: 'ping', token: s }).then(function (r) {
    if (r.ok) {
      guardado('token', s); guardado('nome', r.nome);
      $('senha').value = ''; $('msgSenha').textContent = '';
      telaInicial(); enviarFila();
    } else {
      $('msgSenha').textContent = r.erro === 'Senha inválida' ? 'Senha não cadastrada ou desativada.' : (r.erro || 'Senha não aceita.');
    }
  }).catch(function () {
    $('msgSenha').textContent = 'Sem sinal. O primeiro acesso precisa de internet.';
  });
};
$('sairLogin').onclick = function () {
  if (!confirm('Sair deste celular? As fotos que ainda não subiram continuam guardadas.')) return;
  guardado('token', null); guardado('nome', null);
  fecharCamera(); telaInicial();
};

function telaInicial() {
  var logado = !!guardado('token');
  mostrar('telaSenha', !logado);
  mostrar('usuario', logado);
  mostrar('config', logado);
  mostrar('camera', false);
  $('nomeUsuario').textContent = logado ? 'Viabilizador: ' + (guardado('nome') || '') : '';
  if (guardado('obra')) $('obra').value = guardado('obra');
}

// ---------- Câmera ----------
$('iniciar').onclick = function () {
  if (!obraAtual()) { $('status').textContent = 'Digite o número do projeto.'; $('status').className = 'erro'; return; }
  $('obra').value = obraAtual();
  guardado('obra', obraAtual());
  abrirCamera();
};
$('sair').onclick = fecharCamera;
$('proxima').onclick = function () {
  var s = $('wl');
  if (s.selectedIndex < s.options.length - 1) s.selectedIndex++;
  atualizarTitulo();
};
$('disparo').onclick = fotografar;
$('flash').onclick = function () {
  flashLigado = !flashLigado;
  stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: flashLigado }] }).catch(function () {});
  $('flash').textContent = flashLigado ? 'Flash ON' : 'Flash';
};
function atualizarTitulo() { $('titulo').textContent = obraAtual() + ' · ' + $('wl').value; }

function abrirCamera() {
  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 4096 }, height: { ideal: 3072 } }
  }).then(function (s) {
    stream = s;
    $('video').srcObject = s;
    mostrar('config', false); mostrar('camera', true);
    atualizarTitulo();
    var trilha = s.getVideoTracks()[0];
    captura = null;
    if (window.ImageCapture) { try { captura = new ImageCapture(trilha); } catch (e) {} }
    var cap = trilha.getCapabilities ? trilha.getCapabilities() : {};
    $('flash').style.visibility = cap.torch ? 'visible' : 'hidden';
    iniciarGps();
  }).catch(function (e) {
    $('status').textContent = 'Câmera bloqueada (' + e.name + '). Libere a câmera para este site nas configurações do Chrome.';
    $('status').className = 'erro';
  });
}

function fecharCamera() {
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  if (vigia !== null) navigator.geolocation.clearWatch(vigia);
  stream = null; vigia = null; pos = null; flashLigado = false;
  $('disparo').disabled = true;
  mostrar('camera', false);
  if (guardado('token')) mostrar('config', true);
}

function iniciarGps() {
  if (!navigator.geolocation) { gpsMsg('Este navegador não tem GPS.', 'erro'); return; }
  vigia = navigator.geolocation.watchPosition(function (p) {
    pos = p;
    var prec = Math.round(p.coords.accuracy);
    gpsMsg('GPS ±' + prec + ' m · ' + p.coords.latitude.toFixed(6) + ', ' + p.coords.longitude.toFixed(6) +
      (prec > PRECISAO_ALERTA ? ' (precisão baixa)' : ''), prec <= PRECISAO_ALERTA ? 'ok' : 'alerta');
    $('disparo').disabled = false;
  }, function (e) {
    gpsMsg('GPS: ' + (e.code === 1 ? 'permissão negada. Libere a localização.' : 'sem sinal (' + e.message + ')'), 'erro');
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function gpsMsg(t, c) { $('gps').textContent = t; $('gps').className = c; }

// Foto crua (sem carimbo). O carimbo é feito quando houver sinal para buscar o endereço.
function obterFotoCrua() {
  if (captura) {
    return captura.takePhoto().catch(function () { return quadroDoVideo(); });
  }
  return quadroDoVideo();
}
function quadroDoVideo() {
  var v = $('video'), c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', 0.95); });
}

function fotografar() {
  if (!pos) return;
  var p = pos, agora = new Date(), wl = $('wl').value, obra = obraAtual();
  $('disparo').disabled = true;
  $('flashTela').style.opacity = 0.7; setTimeout(function () { $('flashTela').style.opacity = 0; }, 120);
  obterFotoCrua().then(function (blob) {
    return filaPor({
      idFoto: obra + '-' + agora.getTime() + '-' + Math.random().toString(36).slice(2, 7),
      obra: obra, wl: wl, crua: blob, nome: guardado('nome') || '',
      lat: p.coords.latitude, lng: p.coords.longitude, prec: Math.round(p.coords.accuracy),
      horaCel: dataHora(agora), criado: agora.getTime()
    });
  }).then(function () {
    $('disparo').disabled = false;
    desenharFila(); enviarFila();
  }).catch(function (e) {
    $('status').textContent = 'Erro ao fotografar: ' + e; $('status').className = 'erro';
    $('disparo').disabled = false;
  });
}

// ---------- Carimbo ----------
function quebrar(g, texto, largura) {
  var palavras = String(texto).split(' '), linhas = [], atual = '';
  palavras.forEach(function (p) {
    var teste = atual ? atual + ' ' + p : p;
    if (g.measureText(teste).width > largura && atual) { linhas.push(atual); atual = p; } else atual = teste;
  });
  if (atual) linhas.push(atual);
  return linhas;
}

function carimbarFoto(it) {
  return createImageBitmap(it.crua || it.blob).then(function (img) {
    var esc = Math.min(1, LADO_MAX / Math.max(img.width, img.height));
    var w = Math.round(img.width * esc), h = Math.round(img.height * esc);
    var c = $('tela'); c.width = w; c.height = h;
    var g = c.getContext('2d');
    g.drawImage(img, 0, 0, w, h);
    var fonte = Math.max(18, Math.round(w / 38)), pad = Math.round(fonte * 0.6), alt = fonte * 1.3;
    g.font = 'bold ' + fonte + 'px Arial, sans-serif';
    var largura = w - pad * 2;
    var linhas = [].concat(
      quebrar(g, it.horaCel + '  ·  ' + it.nome, largura),
      quebrar(g, it.endereco || 'Endereço não localizado', largura),
      quebrar(g, it.obra + '  ·  ' + it.wl, largura)
    );
    var pequena = Math.round(fonte * 0.75);
    var coord = it.lat.toFixed(6) + ', ' + it.lng.toFixed(6) + '  (±' + it.prec + ' m)';
    var caixa = linhas.length * alt + pequena * 1.4 + pad * 2;
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.fillRect(0, h - caixa, w, caixa);
    g.fillStyle = '#ffffff';
    g.textBaseline = 'top';
    linhas.forEach(function (t, i) { g.fillText(t, pad, h - caixa + pad + i * alt); });
    g.font = pequena + 'px Arial, sans-serif';
    g.fillText(coord, pad, h - caixa + pad + linhas.length * alt);
    return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', QUALIDADE); });
  });
}

// ---------- Envio ----------
function chamar(corpo) {
  return fetch(SERVIDOR, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corpo)
  }).then(function (r) { return r.json(); });
}
function paraBase64(blob) {
  return new Promise(function (ok) {
    var l = new FileReader();
    l.onload = function () { ok(l.result.split(',')[1]); };
    l.readAsDataURL(blob);
  });
}

function desenharFila() {
  return filaTodos().then(function (itens) {
    var ul = $('fila'); ul.innerHTML = '';
    itens.sort(function (a, b) { return b.criado - a.criado; }).forEach(function (it) {
      var li = document.createElement('li');
      var est = it.erro ? it.erro : (it.endereco === undefined ? 'aguardando sinal (endereço e carimbo)' : 'aguardando envio');
      li.innerHTML = '<span>' + it.wl + ' · ' + it.horaCel.slice(11) + '</span><span class="' + (it.erro ? 'erro' : 'alerta') + '">' + est + '</span>';
      ul.appendChild(li);
    });
    enviadas.slice(-15).reverse().forEach(function (n) {
      var li = document.createElement('li');
      li.innerHTML = '<span>' + n + '</span><span class="ok">no Drive ✓</span>';
      ul.appendChild(li);
    });
    var st = $('status');
    if (itens.length) { st.textContent = itens.length + ' foto(s) guardada(s) no celular, aguardando sinal.'; st.className = 'alerta'; }
    else { st.textContent = enviadas.length ? 'Todas as fotos enviadas.' : ''; st.className = 'ok'; }
    return itens;
  });
}

// Uma foto: busca endereço (se ainda não tem), carimba e envia.
function processar(it, token) {
  var passo = Promise.resolve();
  if (it.endereco === undefined) {
    passo = chamar({ acao: 'endereco', token: token, lat: it.lat, lng: it.lng }).then(function (r) {
      if (!r.ok) throw { servidor: r.erro };
      it.endereco = r.endereco || '';
      return filaPor(it);
    });
  }
  return passo.then(function () { return carimbarFoto(it); })
    .then(paraBase64)
    .then(function (b64) {
      return chamar({
        acao: 'foto', token: token, obra: it.obra, wl: it.wl, base64: b64,
        lat: it.lat, lng: it.lng, prec: it.prec, horaCel: it.horaCel, idFoto: it.idFoto, endereco: it.endereco
      });
    }).then(function (r) {
      if (!r.ok) throw { servidor: r.erro };
      enviadas.push(r.nome);
      return filaTirar(it.idFoto);
    });
}

function enviarFila() {
  if (enviando || !db) return;
  var token = guardado('token');
  if (!token) return;
  enviando = true;
  filaTodos().then(function (itens) {
    itens.sort(function (a, b) { return a.criado - b.criado; });
    return itens.reduce(function (cadeia, it) {
      return cadeia.then(function (parar) {
        if (parar) return true;
        return processar(it, token).then(function () { desenharFila(); return false; }, function (e) {
          if (e && e.servidor === 'Senha inválida') {
            guardado('token', null); guardado('nome', null); telaInicial();
            $('msgSenha').textContent = 'Sua senha foi desativada ou trocada. Fale com a Secretaria Técnica.';
            return true;
          }
          if (e && e.servidor) { it.erro = 'erro: ' + e.servidor; return filaPor(it).then(function () { return false; }); }
          return true; // sem sinal: tenta mais tarde
        });
      });
    }, Promise.resolve(false));
  }).then(function () {
    enviando = false; desenharFila();
  }, function () { enviando = false; });
}

window.addEventListener('online', enviarFila);
setInterval(enviarFila, 30000);

abrirBanco().then(function (b) { db = b; telaInicial(); desenharFila(); enviarFila(); })
  .catch(function (e) { $('status').textContent = 'Erro no armazenamento do celular: ' + e; $('status').className = 'erro'; });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
</script>
</body>
</html>
